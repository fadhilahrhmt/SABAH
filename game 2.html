
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABAH_HERITAGE // ARCHIVE_MATCH</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Space+Mono:wght@400;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* 1. UNIFIED DESIGN SYSTEM */
        :root {
            --bg-color: #080808;
            --text-color: #ffffff;
            --accent-color: #d4af37;
            --nav-bg: #080808;
            --glass-border: rgba(255, 255, 255, 0.15);
            --font-main: 'Space Mono', monospace;
            --font-heading: 'Syncopate', sans-serif;
        }

        [data-theme="light"] {
            --bg-color: #f9f7f2;
            --text-color: #1a1a1a;
            --accent-color: #8b6e3c;
            --nav-bg: #f9f7f2;
            --glass-border: rgba(0, 0, 0, 0.1);
        }

        /* Enforce custom cursor everywhere, even over cards and overlays */
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background 0.4s ease;
        }

        /* 2. FIXED PERSISTENT CURSOR SYSTEM */
        #custom-cursor {
            width: 8px; height: 8px;
            background-color: var(--accent-color);
            border-radius: 50%;
            position: fixed; pointer-events: none;
            z-index: 99999; transform: translate(-50%, -50%);
            transition: background-color 0.3s, width 0.2s, height 0.2s;
        }

        #cursor-follower {
            width: 40px; height: 40px;
            border: 1px solid var(--accent-color);
            border-radius: 50%;
            position: fixed; pointer-events: none;
            z-index: 99998; transform: translate(-50%, -50%);
            transition: transform 0.1s ease-out, background 0.3s ease, width 0.2s, height 0.2s;
        }

        /* 3. NAVIGATION */
        .site-nav {
            position: fixed; top: 0; width: 100%; height: 80px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 50px; background: var(--nav-bg); border-bottom: 1px solid var(--glass-border);
            z-index: 5000;
        }

        .logo-box h1 { 
            font-family: var(--font-heading); 
            font-size: 14px; 
            letter-spacing: 4px; 
            color: var(--text-color);
        }

        .nav-menu { display: flex; gap: 30px; list-style: none; }
        
        .nav-menu a { 
            color: var(--text-color); 
            text-decoration: none; 
            font-size: 11px; 
            opacity: 0.6; 
            transition: 0.3s; 
            text-transform: uppercase; 
            font-weight: 700;
        }
        .nav-menu a.active, .nav-menu a:hover { opacity: 1; color: var(--accent-color); }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .swap-mode-btn {
            background: none; 
            border: 1px solid var(--accent-color); 
            color: var(--accent-color); 
            padding: 5px 15px; 
            font-size: 10px; 
            font-family: var(--font-main);
            transition: background 0.3s ease, color 0.3s ease;
        }
        
        .swap-mode-btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
        }

        #digital-clock {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-color);
            border-left: 1px solid var(--glass-border);
            padding-left: 20px;
        }

        /* Hamburger Menu Elements */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 4px;
            background: none;
            border: none;
            z-index: 5002;
        }
        .hamburger span {
            width: 20px;
            height: 2px;
            background-color: var(--text-color);
            transition: 0.3s ease;
        }

        /* 4. GAME LAYOUT */
        .game-container {
            flex: 1;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
            padding: 30px 60px;
            margin-top: 80px;
            max-height: calc(100vh - 80px);
        }

        .marks-board {
            border-right: 1px solid var(--glass-border);
            padding-right: 30px;
            display: flex;
            flex-direction: column;
        }

        .marks-board h3 {
            font-family: 'Cinzel', serif;
            font-size: 13px;
            letter-spacing: 3px;
            color: var(--accent-color);
            margin-bottom: 30px;
        }

        .score-list { flex: 1; list-style: none; overflow-y: auto; }

        .score-item {
            display: flex; justify-content: space-between;
            padding: 15px 0; border-bottom: 1px solid var(--glass-border);
            font-size: 10px; opacity: 0.7;
        }

        /* 5. INTERACTIVE GRID */
        .game-area { display: flex; flex-direction: column; }
        .stats-bar { 
            margin-bottom: 20px; font-size: 11px; 
            letter-spacing: 2px; color: var(--accent-color); 
            text-transform: uppercase;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
            height: 100%;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            position: relative; transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .card.flipped { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden;
        }

        .card-back { background: #111; }
        .card-front {
            background: #000; transform: rotateY(180deg);
            border: 1px solid var(--accent-color);
            padding: 10px; display: flex; align-items: center; justify-content: center;
        }
        .card-front img { max-width: 85%; max-height: 85%; object-fit: contain; }

        /* 6. SYSTEM OVERLAYS */
        .overlay {
            position: fixed; inset: 0; background: var(--bg-color);
            display: flex; justify-content: center; align-items: center; z-index: 10000;
            overflow-y: auto; padding: 20px 0;
        }

        .panel {
            text-align: center; max-width: 450px; width: 100%;
            border: 1px solid var(--glass-border);
            padding: 60px; background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
        }

        .mobile-score-container {
            display: none;
            margin: 20px 0;
            padding: 15px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            text-align: left;
        }
        .mobile-score-container h4 {
            font-family: 'Cinzel', serif;
            font-size: 11px;
            color: var(--accent-color);
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-align: center;
        }

        .action-btn {
            background: transparent; color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 12px 35px; font-size: 10px; letter-spacing: 4px;
            text-transform: uppercase; font-family: 'Space Mono'; margin-top: 15px;
            width: 100%; transition: 0.3s;
        }

        .action-btn:hover {
            background: var(--accent-color);
            color: #000;
        }

        input {
            background: transparent; border: none; border-bottom: 1px solid var(--accent-color);
            color: var(--text-color); padding: 10px; width: 100%; text-align: center;
            font-family: 'Space Mono'; outline: none; margin-bottom: 20px; font-size: 12px;
        }

        /* TARGETED RESPONSIVE OVERRIDES */
        @media (max-width: 1100px) {
            * { cursor: auto !important; } 
            #custom-cursor, #cursor-follower { display: none !important; }

            body {
                overflow: auto;
                height: auto;
                min-height: 100vh;
            }

            .site-nav { padding: 0 20px; }
            .logo-box { display: block; }
            .logo-box h1 { font-size: 11px; letter-spacing: 2px; }

            .hamburger { display: flex; }
            
            .nav-menu {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                position: fixed;
                top: 0;
                right: -100%;
                width: 75%;
                height: 100vh;
                background: var(--nav-bg);
                border-left: 1px solid var(--glass-border);
                transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
                z-index: 5001;
                gap: 40px;
            }
            
            .nav-menu.mobile-open { right: 0; }
            .nav-menu a { font-size: 16px; letter-spacing: 3px; }

            .hamburger.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
            .hamburger.open span:nth-child(2) { opacity: 0; }
            .hamburger.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

            .nav-right { gap: 15px; }
            .swap-mode-btn { padding: 4px 10px; font-size: 9px; }
            #digital-clock { padding-left: 12px; font-size: 11px; }

            .game-container { 
                grid-template-columns: 1fr; 
                margin-top: 80px; 
                padding: 20px;
                max-height: none;
                flex: none;
            }
            
            .marks-board { display: none; }

            /* Balanced 3x4 Grid Structure For 12 Cards on Mobile */
            .game-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
                height: auto;
                min-height: 50vh;
            }
            
            .card { aspect-ratio: 1 / 1; }
            .panel { padding: 30px 20px; margin: auto 20px; width: calc(100% - 40px); }
            
            /* Displays leaderboard inside win module exclusively on mobile devices */
            .mobile-score-container { display: block; }
        }

        @media (max-width: 480px) {
            .swap-mode-btn { display: none; }
        }
    </style>
</head>
<body>

<div id="custom-cursor"></div>
<div id="cursor-follower"></div>

<nav class="site-nav">
    <div class="logo-box"><h1>SABAH_HERITAGE</h1></div>
    <ul class="nav-menu" id="navMenu">
        <li><a href="index.html">Home</a></li>
        <li><a href="explore.html">Explore</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="game.html">Game</a></li>
        <li><a href="about.html">About</a></li>
    </ul>
    <div class="nav-right">
        <button onclick="toggleTheme()" class="swap-mode-btn">MODE_SWAP</button>
        <div id="digital-clock">00:00:00</div>
        <button class="hamburger" id="hamburgerBtn" onclick="toggleMobileMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>
</nav>

<div id="intro-overlay" class="overlay">
    <div class="panel">
        <h2 style="font-family: 'Cinzel'; letter-spacing: 5px; color: var(--accent-color); margin-bottom: 20px;">HERITAGE_MATCH</h2>
        <p style="font-size: 9px; line-height: 2; opacity: 0.6; text-transform: uppercase;">Sync the traditional data sets of North Borneo. Precision required.</p>
        <button class="action-btn" onclick="startQuest()">INIT_SYSTEM</button>
    </div>
</div>

<div id="win-overlay" class="overlay" style="display:none;">
    <div class="panel">
        <h2 id="win-title" style="font-family: 'Cinzel'; color: var(--accent-color);">SYNC_SUCCESS</h2>
        <p id="final-time" style="margin: 20px 0; font-size: 12px;"></p>
        
        <div class="mobile-score-container">
            <h4>TOP_SCORERS_RANK</h4>
            <ul class="score-list" id="mobileLeaderboard"></ul>
        </div>

        <div id="input-section">
            <input type="text" id="player-name" placeholder="IDENT_NAME">
            <button class="action-btn" onclick="saveScore()">SAVE_LOG</button>
        </div>
        <div id="post-game-btns" style="display:none; gap: 10px; flex-direction: column;">
            <button class="action-btn" onclick="startQuest()">RE_BOOT</button>
            <a href="game.html" style="text-decoration: none; width: 100%;">
                <button class="action-btn">MAIN_MENU</button>
            </a>
        </div>
    </div>
</div>

<div class="game-container">
    <aside class="marks-board">
        <h3>RECORDS_LOG</h3>
        <ul class="score-list" id="leaderboard"></ul>
        
        <div class="board-actions" style="margin-top: 20px;">
            <button class="action-btn" onclick="startQuest()" style="font-size: 8px; padding: 10px;">RELOAD_SESSION</button>
            <a href="game.html" style="text-decoration: none;">
                <button class="action-btn" style="font-size: 8px; padding: 10px;">MAIN_MENU</button>
            </a>
        </div>
    </aside>

    <main class="game-area">
        <div class="stats-bar">
            SYS_TIMER: <span id="timer">0.00</span>S // MATCHED: <span id="matches">0</span>/<span id="total-matches-label">12</span>
        </div>
        <div class="game-grid" id="grid"></div>
    </main>
</div>

<script>
    function toggleMobileMenu() {
        const menu = document.getElementById('navMenu');
        const btn = document.getElementById('hamburgerBtn');
        menu.classList.toggle('mobile-open');
        btn.classList.toggle('open');
    }

    document.querySelectorAll('.nav-menu a').forEach(link => {
        link.addEventListener('click', () => {
            document.getElementById('navMenu').classList.remove('mobile-open');
            document.getElementById('hamburgerBtn').classList.remove('open');
        });
    });

    function runLiveClock() {
        const now = new Date();
        const display = document.getElementById('digital-clock');
        if (display) {
            display.innerText = now.toLocaleTimeString('en-GB', { hour12: false });
        }
    }
    setInterval(runLiveClock, 1000);
    runLiveClock();

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let musicInterval;

    function playFlipSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
        osc.frequency.exponentialRampToValueAtTime(783.99, audioCtx.currentTime + 0.1); 
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
    }

    function initBackgroundMusic() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25]; 
        let step = 0;

        function playNextNote() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine'; 
            let currentNote = notes[step % notes.length];
            if (step % 4 === 0) currentNote = notes[0] / 2; 
            
            osc.frequency.setValueAtTime(currentNote, audioCtx.currentTime);
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 0.1); 
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 1.3);
            step++;
        }

        if(musicInterval) clearInterval(musicInterval);
        musicInterval = setInterval(playNextNote, 450);
    }

    const cursor = document.getElementById('custom-cursor');
    const follower = document.getElementById('cursor-follower');
    
    window.addEventListener('mousemove', (e) => {
        if (window.innerWidth > 1100) {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            follower.style.left = e.clientX + 'px';
            follower.style.top = e.clientY + 'px';
        }
    });

    document.addEventListener('mouseover', (e) => {
        if (window.innerWidth <= 1100) return;
        const target = e.target.closest('.nav-menu a, button, .card, .action-btn, input');
        if (target) {
            follower.style.width = '55px';
            follower.style.height = '55px';
            follower.style.background = 'rgba(212, 175, 89, 0.08)';
        }
    });

    document.addEventListener('mouseout', (e) => {
        if (window.innerWidth <= 1100) return;
        const target = e.target.closest('.nav-menu a, button, .card, .action-btn, input');
        if (target) {
            follower.style.width = '40px';
            follower.style.height = '40px';
            follower.style.background = 'transparent';
        }
    });

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme');
        document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    }

    const items = [
        { n: 'sinuangga.png', i: 'sinuangga.png' }, { n: 'himpogot.png', i: 'himpogot.jpg' },
        { n: 'gaung.png', i: 'gaung.png' }, { n: 'sigar.jpg', i: 'sigar.jpg' },
        { n: 'badu simpak.png', i: 'badu simpak.png' }, { n: 'sinikot.jpg', i: 'sinikot.jpg' },
        { n: 'tupi sinulatan.jpg', i: 'tupi sinulatan.jpg' }, { n: 'sarimpak.jpg', i: 'sarimpak.jpg' },
        { n: 'pinongkoloh.jpg', i: 'pinongkoloh.jpg' }, { n: 'lumpirot.png', i: 'lumpirot.png' },
        { n: 'badu sampit.jpg', i: 'badu sampit.jpg' }, { n: 'babaru puputul.png', i: 'babaru puputul.png' }
    ];

    let flipped = [], matched = 0, targetMatches = 12, startTime, timerInt, active = false, musicInitialized = false;

    function startQuest() {
        if (!musicInitialized) {
            initBackgroundMusic();
            musicInitialized = true;
        }

        document.getElementById('intro-overlay').style.display = 'none';
        document.getElementById('win-overlay').style.display = 'none';
        document.getElementById('input-section').style.display = 'block';
        document.getElementById('post-game-btns').style.display = 'none';

        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        matched = 0;
        document.getElementById('matches').innerText = "0";

        let deck = [];
        const isMobile = window.innerWidth <= 1100;

        if (isMobile) {
            targetMatches = 6; // 6 unique matching pairs = exactly 12 cards total layout
            document.getElementById('total-matches-label').innerText = "6";
            
            let shuffledItems = [...items].sort(() => Math.random() - 0.5);
            let roundPairs = shuffledItems.slice(0, 6);

            roundPairs.forEach(x => {
                deck.push({ name: x.n, val: `<img src="${x.i}">` });
                deck.push({ name: x.n, val: `<img src="${x.i}">` });
            });
        } else {
            targetMatches = 12; // Complete full asset library set for desktop configurations
            document.getElementById('total-matches-label').innerText = "12";
            items.forEach(x => {
                deck.push({ name: x.n, val: `<img src="${x.i}">` });
                deck.push({ name: x.n, val: `<img src="${x.i}">` });
            });
        }
        
        deck.sort(() => Math.random() - 0.5);

        deck.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.name = item.name;
            card.innerHTML = `<div class="card-back"></div><div class="card-front">${item.val}</div>`;
            card.onclick = () => flip(card);
            grid.appendChild(card);
        });

        startTime = Date.now();
        active = true;
        clearInterval(timerInt);
        timerInt = setInterval(() => {
            document.getElementById('timer').innerText = ((Date.now() - startTime) / 1000).toFixed(2);
        }, 50);
    }

    function flip(card) {
        if (!active || flipped.length >= 2 || card.classList.contains('flipped')) return;
        
        playFlipSound();
        card.classList.add('flipped');
        flipped.push(card);
        if (flipped.length === 2) check();
    }

    function check() {
        const [a, b] = flipped;
        if (a.dataset.name === b.dataset.name) {
            matched++;
            document.getElementById('matches').innerText = matched;
            flipped = [];
            if (matched === targetMatches) victory();
        } else {
            setTimeout(() => { a.classList.remove('flipped'); b.classList.remove('flipped'); flipped = []; }, 600);
        }
    }

    function victory() {
        active = false;
        clearInterval(timerInt);
        const finalTime = document.getElementById('timer').innerText;
        document.getElementById('final-time').innerText = "RECORD_LOG: " + finalTime + "S";
        
        // Ensure scoreboard populates natively on mobile screen layout frames
        loadBoard();
        document.getElementById('win-overlay').style.display = 'flex';
    }

    function saveScore() {
        const name = document.getElementById('player-name').value || "ANON";
        const time = parseFloat(document.getElementById('timer').innerText);
        let scores = JSON.parse(localStorage.getItem('sabahQuest')) || [];
        scores.push({ name, time });
        scores.sort((a, b) => a.time - b.time);
        localStorage.setItem('sabahQuest', JSON.stringify(scores.slice(0, 5)));
        loadBoard();
        
        document.getElementById('input-section').style.display = 'none';
        document.getElementById('post-game-btns').style.display = 'flex';
    }

    function loadBoard() {
        const scores = JSON.parse(localStorage.getItem('sabahQuest')) || [];
        const scoreMarkup = scores.map((s, i) => `
            <li class="score-item">
                <span>${i + 1}. ${s.name}</span>
                <span>${s.time.toFixed(2)}s</span>
            </li>`).join('') || '<li class="score-item">WAITING_FOR_DATA</li>';
            
        // Sync data across both separate structural layout boards simultaneously
        document.getElementById('leaderboard').innerHTML = scoreMarkup;
        document.getElementById('mobileLeaderboard').innerHTML = scoreMarkup;
    }

    loadBoard();
</script>
</body>
</html>
